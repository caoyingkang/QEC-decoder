[project]
name = "benchmark-app"
version = "0.1.0"
description = "Streamlit UI for benchmarking trained PyTorch QEC decoders."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "qecbench",
    "qecdec",
    "torchdecoder_core",
    "numpy==2.2.*",
    "matplotlib",
    "omegaconf",
    "humanize",
    "rich",
    "pandas",
    "stim",
    "torch",
    "streamlit",
    "plotly",
]

[tool.uv]
package = false

[tool.uv.sources]
qecbench = { workspace = true }
qecdec = { workspace = true }
torchdecoder_core = { workspace = true }
