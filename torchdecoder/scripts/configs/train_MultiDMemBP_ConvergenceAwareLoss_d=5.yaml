qec:
  code: RotatedSurfaceCode
  noise_model: Phenomenological
  d: 5
  rounds: 5
  basis: Z
  p: 0.01

model:
  name: MultiDMemBP
  num_iters: 10
  msg_features: 16
  min_impl_method: hard
  sign_impl_method: hard
  gamma_shared: false  # true = one gamma per VN, shared across message components; false = one gamma per VN and per message component
  gamma_init: 0  # single scalar: all gamma use this value; [a, b]: sample independently and uniformly from [a, b]
  llr_pooling: mean  # options: "mean", "weighted_mean", "per_variable_weighted_mean"
  mlp:
    hidden_features: 64
    hidden_depth: 2
    activation: Tanh  # options: "Sigmoid", "Tanh", "ReLU", "GELU", "SiLU".
    norm: null  # null = no normalization; options: "LayerNorm", "RMSNorm".
    dropout_p: 0.05

loss:
  name: ConvergenceAwareLoss
  beta: 0.5
  focal_gamma: 2.0
  # curriculum:
  #   max_emphasis: 5.0
  #   ramp_epochs: 15

optim:
  lr: 0.002
  lr_scheduler:
    factor: 0.2
    patience: 3
    threshold: 0.001
    threshold_mode: rel

early_stopping:
  min_delta: 0.0
  patience: 10

tb_logger:
  log_graph: false

data:
  batch_size: 256
  num_workers: null   # null = use cpu_count - 1

trainer:
  accelerator: auto  # auto = auto-detect available accelerator
  max_epochs: 50
  enable_progress_bar: true

compile_mode: null  # options: null, default, reduce-overhead, max-autotune
