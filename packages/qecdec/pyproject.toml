[project]
name = "qecdec"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
]
dynamic = ["version"]
dependencies = ["numpy==2.2.*", "stim", "sinter", "pymatching", "ldpc"]

[dependency-groups]
test = ["pytest"]
qecdec-notebooks = [
    "notebook",
    "ipykernel",
    "ipywidgets",
    "sinter",
    "matplotlib",
    "matplotlib-inline",
    "plotly",
    "nbformat",
    "nevergrad",
    "drawsvg",
]

[build-system]
requires = ["maturin>=1.9,<2.0"]
build-backend = "maturin"

[tool.maturin]
python-source = "python"
features = ["pyo3/extension-module"]
