[project]
name = "torchdecoder-core"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "qecdec",
    "torch",
    "torchmetrics",
    "numpy",
    "omegaconf",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/torchdecoder_core"]

[tool.uv]
package = true

[tool.uv.sources]
qecdec = { workspace = true }
