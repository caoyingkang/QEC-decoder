[project]
name = "qecbench"
version = "0.1.0"
description = "Customized Monte Carlo benchmark tool for QEC decoders."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "stim",
    "humanize",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qecbench"]

[tool.uv]
package = true
