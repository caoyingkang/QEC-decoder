[project]
name = "qecbench"
version = "0.1.0"
description = "Monte Carlo benchmarking for QEC decoders (qecdec + torchdecoder-core)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "qecdec",
    "torchdecoder-core",
    "numpy",
    "stim",
    "torch",
    "omegaconf",
    "matplotlib",
    "plotly",
    "humanize",
    "rich",
    "frozendict",
]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qecbench"]

[tool.uv]
package = true

[tool.uv.sources]
qecdec = { workspace = true }
torchdecoder-core = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
