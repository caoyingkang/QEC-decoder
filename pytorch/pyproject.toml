[project]
name = "pytorch-decoders"
version = "0.1.0"
description = "Neural-network-based QEC decoders."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "qecdec",
    "numpy==2.2.*",
    "torch",
    "torchmetrics",
    "lightning",
    "tensorboard",
    "torch-tb-profiler",
    "omegaconf",
    "tabulate",
    "humanize",
]

[tool.uv]
package = false

[tool.uv.sources]
qecdec = { workspace = true }
